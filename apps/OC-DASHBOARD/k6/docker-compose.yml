services:
  influxdb:
    image: influxdb:1.8.10
    container_name: oc-dashboard-k6-influxdb
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    volumes:
      - k6-influxdb-data:/var/lib/influxdb

  grafana:
    image: grafana/grafana-oss:11.5.2
    container_name: oc-dashboard-k6-grafana
    depends_on:
      - influxdb
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - k6-grafana-data:/var/lib/grafana

volumes:
  k6-influxdb-data:
  k6-grafana-data:
