name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/frontend-deploy.yml"
      - "apps/OC-ADMIN/**"
      - "apps/OC-RECORD/**"
      - "apps/OC-DASHBOARD/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
  workflow_dispatch:

concurrency:
  group: frontend-prod
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      FRONTEND_S3_BUCKET: ${{ secrets.FRONTEND_S3_BUCKET }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      API_BASE_URL: https://api.oceancampus.kr
      S3_PUBLIC_BASE: https://api.oceancampus.kr
      MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
      MAPBOX_STYLE_URL: ${{ secrets.MAPBOX_STYLE_URL }}
      FRONTEND_REMOTE_ROOT: /opt/oceancampus/frontend
      DASHBOARD_REMOTE_ROOT: /opt/oceancampus/dashboard
      DASHBOARD_REMOTE_APP_DIR: /opt/oceancampus/dashboard/apps/OC-DASHBOARD
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Validate required secrets
        shell: bash
        run: |
          required=(
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            AWS_REGION
            FRONTEND_S3_BUCKET
            EC2_INSTANCE_ID
            API_BASE_URL
            S3_PUBLIC_BASE
            MAPBOX_TOKEN
            MAPBOX_STYLE_URL
          )

          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required secrets/env values:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          FRONTEND_S3_BUCKET: ${{ secrets.FRONTEND_S3_BUCKET }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          MAPBOX_STYLE_URL: ${{ secrets.MAPBOX_STYLE_URL }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend apps
        run: pnpm build

      - name: Verify CloudFront domain is absent
        shell: bash
        run: |
          if grep -R --binary-files=without-match -n "d24m5p5t9qbt5o.cloudfront.net" \
            apps/OC-ADMIN/dist \
            apps/OC-RECORD/dist; then
            echo "::error::CloudFront domain remains in admin/record build output."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package frontend deployment artifact
        id: frontend_artifact
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="${RUNNER_TEMP}/oc-frontend-artifact"
          artifact_name="oc-frontend-${GITHUB_SHA}.tar.gz"
          artifact_path="${RUNNER_TEMP}/${artifact_name}"
          artifact_key="deployments/frontend/${GITHUB_SHA}/${artifact_name}"

          rm -rf "${artifact_dir}"
          mkdir -p \
            "${artifact_dir}/admin" \
            "${artifact_dir}/record" \
            "${artifact_dir}/dashboard/standalone" \
            "${artifact_dir}/dashboard/static" \
            "${artifact_dir}/dashboard/public"

          cp -R apps/OC-ADMIN/dist/. "${artifact_dir}/admin/"
          cp -R apps/OC-RECORD/dist/. "${artifact_dir}/record/"
          cp -R apps/OC-DASHBOARD/.next/standalone/. "${artifact_dir}/dashboard/standalone/"
          cp -R apps/OC-DASHBOARD/.next/static/. "${artifact_dir}/dashboard/static/"

          if [ -d apps/OC-DASHBOARD/public ]; then
            cp -R apps/OC-DASHBOARD/public/. "${artifact_dir}/dashboard/public/"
          fi

          {
            echo "NODE_ENV=production"
            echo "PORT=3000"
            echo "HOSTNAME=127.0.0.1"
            echo "API_BASE_URL=${API_BASE_URL}"
            echo "S3_PUBLIC_BASE=${S3_PUBLIC_BASE}"
            echo "MAPBOX_TOKEN=${MAPBOX_TOKEN}"
            echo "MAPBOX_STYLE_URL=${MAPBOX_STYLE_URL}"
          } > "${artifact_dir}/dashboard/dashboard.env"

          tar -czf "${artifact_path}" -C "${artifact_dir}" .

          echo "artifact_key=${artifact_key}" >> "${GITHUB_OUTPUT}"

          aws s3 cp "${artifact_path}" "s3://${FRONTEND_S3_BUCKET}/${artifact_key}" \
            --sse AES256

          artifact_url="$(aws s3 presign "s3://${FRONTEND_S3_BUCKET}/${artifact_key}" --expires-in 1800)"

          echo "artifact_url=${artifact_url}" >> "${GITHUB_OUTPUT}"

      - name: Deploy frontend through SSM
        shell: bash
        run: |
          set -euo pipefail

          artifact_url="${{ steps.frontend_artifact.outputs.artifact_url }}"
          printf -v artifact_url_quoted '%q' "${artifact_url}"

          remote_command="$(
            cat <<EOF
          set -euo pipefail

          artifact_url=${artifact_url_quoted}
          frontend_root='${FRONTEND_REMOTE_ROOT}'
          remote_root='${DASHBOARD_REMOTE_ROOT}'
          remote_app_dir='${DASHBOARD_REMOTE_APP_DIR}'
          archive_path="/tmp/oc-frontend-${GITHUB_SHA}.tar.gz"
          release_dir="\$(mktemp -d /tmp/oc-frontend-release.XXXXXX)"

          cleanup() {
            rm -rf "\${release_dir}" "\${archive_path}"
          }
          trap cleanup EXIT

          curl -fsSL "\${artifact_url}" -o "\${archive_path}"
          mkdir -p "\${frontend_root}/admin" "\${frontend_root}/record"
          mkdir -p "\${remote_root}" "\${remote_app_dir}/.next/static" "\${remote_app_dir}/public"
          tar -xzf "\${archive_path}" -C "\${release_dir}"

          rm -rf "\${frontend_root}/admin" "\${frontend_root}/record"
          mkdir -p "\${frontend_root}/admin" "\${frontend_root}/record"
          cp -a "\${release_dir}/admin/." "\${frontend_root}/admin/"
          cp -a "\${release_dir}/record/." "\${frontend_root}/record/"

          find "\${remote_root}" -mindepth 1 -maxdepth 1 ! -name '.env' -exec rm -rf {} +
          cp -a "\${release_dir}/dashboard/standalone/." "\${remote_root}/"

          rm -rf "\${remote_app_dir}/.next/static"
          mkdir -p "\${remote_app_dir}/.next/static"
          cp -a "\${release_dir}/dashboard/static/." "\${remote_app_dir}/.next/static/"

          rm -rf "\${remote_app_dir}/public"
          mkdir -p "\${remote_app_dir}/public"
          cp -a "\${release_dir}/dashboard/public/." "\${remote_app_dir}/public/"

          install -m 600 "\${release_dir}/dashboard/dashboard.env" "\${remote_root}/.env"

          sudo systemctl restart oceancampus-dashboard
          sudo systemctl is-active oceancampus-dashboard
          if command -v nginx >/dev/null 2>&1; then
            sudo nginx -t
            sudo systemctl reload nginx
          fi
          EOF
          )"

          jq -n \
            --arg command "${remote_command}" \
            '{commands: [$command], executionTimeout: ["900"]}' \
            > "${RUNNER_TEMP}/ssm-frontend-deploy.json"

          command_id="$(
            aws ssm send-command \
              --instance-ids "${EC2_INSTANCE_ID}" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy OC frontend ${GITHUB_SHA}" \
              --parameters "file://${RUNNER_TEMP}/ssm-frontend-deploy.json" \
              --query 'Command.CommandId' \
              --output text
          )"

          set +e
          aws ssm wait command-executed \
            --command-id "${command_id}" \
            --instance-id "${EC2_INSTANCE_ID}"
          wait_status=$?
          set -e

          echo "SSM command stdout:"
          aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query 'StandardOutputContent' \
            --output text || true

          echo "SSM command stderr:"
          aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query 'StandardErrorContent' \
            --output text || true

          command_status="$(
            aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query 'Status' \
              --output text
          )"

          if [ "${wait_status}" -ne 0 ] || [ "${command_status}" != "Success" ]; then
            echo "::error::SSM frontend deploy failed with status ${command_status}."
            exit 1
          fi

      - name: Delete frontend deployment artifact
        if: always() && steps.frontend_artifact.outputs.artifact_key != ''
        shell: bash
        run: |
          aws s3 rm "s3://${FRONTEND_S3_BUCKET}/${{ steps.frontend_artifact.outputs.artifact_key }}" || true
