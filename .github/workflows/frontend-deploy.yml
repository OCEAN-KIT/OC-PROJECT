name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/frontend-deploy.yml"
      - "apps/OC-ADMIN/**"
      - "apps/OC-RECORD/**"
      - "apps/OC-DASHBOARD/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
  workflow_dispatch:

concurrency:
  group: frontend-prod
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      FRONTEND_S3_BUCKET: ${{ secrets.FRONTEND_S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SECURITY_GROUP_ID: ${{ secrets.EC2_SECURITY_GROUP_ID }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      S3_PUBLIC_BASE: ${{ secrets.S3_PUBLIC_BASE }}
      MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
      DASHBOARD_REMOTE_ROOT: /opt/oceancampus/dashboard
      DASHBOARD_REMOTE_APP_DIR: /opt/oceancampus/dashboard/apps/OC-DASHBOARD
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Validate required secrets
        shell: bash
        run: |
          required=(
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            AWS_REGION
            FRONTEND_S3_BUCKET
            CLOUDFRONT_DISTRIBUTION_ID
            EC2_HOST
            EC2_USER
            EC2_SECURITY_GROUP_ID
            API_BASE_URL
            S3_PUBLIC_BASE
            MAPBOX_TOKEN
          )

          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required secrets/env values:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          FRONTEND_S3_BUCKET: ${{ secrets.FRONTEND_S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SECURITY_GROUP_ID: ${{ secrets.EC2_SECURITY_GROUP_ID }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          S3_PUBLIC_BASE: ${{ secrets.S3_PUBLIC_BASE }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend apps
        run: pnpm build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy admin to S3
        shell: bash
        run: |
          aws s3 sync apps/OC-ADMIN/dist "s3://${FRONTEND_S3_BUCKET}/admin" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

          aws s3 cp apps/OC-ADMIN/dist/index.html "s3://${FRONTEND_S3_BUCKET}/admin/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Deploy record to S3
        shell: bash
        run: |
          aws s3 sync apps/OC-RECORD/dist "s3://${FRONTEND_S3_BUCKET}/record" \
            --delete \
            --exclude "index.html" \
            --exclude "sw.js" \
            --exclude "manifest.webmanifest" \
            --cache-control "public,max-age=31536000,immutable"

          aws s3 cp apps/OC-RECORD/dist/index.html "s3://${FRONTEND_S3_BUCKET}/record/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"

          if [ -f apps/OC-RECORD/dist/sw.js ]; then
            aws s3 cp apps/OC-RECORD/dist/sw.js "s3://${FRONTEND_S3_BUCKET}/record/sw.js" \
              --cache-control "no-cache,no-store,must-revalidate" \
              --content-type "application/javascript"
          fi

          if [ -f apps/OC-RECORD/dist/manifest.webmanifest ]; then
            aws s3 cp apps/OC-RECORD/dist/manifest.webmanifest "s3://${FRONTEND_S3_BUCKET}/record/manifest.webmanifest" \
              --cache-control "no-cache,no-store,must-revalidate" \
              --content-type "application/manifest+json"
          fi

      - name: Allow runner SSH access
        id: ssh_access
        shell: bash
        run: |
          runner_ip="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          echo "runner_ip=${runner_ip}" >> "${GITHUB_OUTPUT}"

          if ! output="$(aws ec2 authorize-security-group-ingress \
            --group-id "${EC2_SECURITY_GROUP_ID}" \
            --protocol tcp \
            --port 22 \
            --cidr "${runner_ip}/32" 2>&1)"; then
            if grep -q "InvalidPermission.Duplicate" <<< "${output}"; then
              echo "SSH ingress already exists for ${runner_ip}/32"
            else
              echo "${output}"
              exit 1
            fi
          fi

      - name: Prepare SSH
        id: prepare_ssh
        shell: bash
        run: |
          mkdir -p ~/.ssh
          ssh_key_path="${HOME}/.ssh/oceancampus-frontend-cd"
          rm -f "${ssh_key_path}" "${ssh_key_path}.pub"
          ssh-keygen -t ed25519 -N '' -f "${ssh_key_path}" -q
          chmod 600 "${ssh_key_path}"

          instance_info="$(
            aws ec2 describe-instances \
              --filters "Name=dns-name,Values=${EC2_HOST}" "Name=instance-state-name,Values=running" \
              --query 'Reservations[].Instances[].[InstanceId,Placement.AvailabilityZone]' \
              --output text | awk 'NF { print; exit }'
          )"

          if [ -z "${instance_info}" ]; then
            instance_info="$(
              aws ec2 describe-instances \
                --filters "Name=ip-address,Values=${EC2_HOST}" "Name=instance-state-name,Values=running" \
                --query 'Reservations[].Instances[].[InstanceId,Placement.AvailabilityZone]' \
                --output text | awk 'NF { print; exit }'
            )"
          fi

          read -r instance_id availability_zone <<< "${instance_info}"

          if [ -z "${instance_id}" ] || [ -z "${availability_zone}" ]; then
            echo "::error::Unable to resolve running EC2 instance from EC2_HOST."
            exit 1
          fi

          echo "instance_id=${instance_id}" >> "${GITHUB_OUTPUT}"
          echo "availability_zone=${availability_zone}" >> "${GITHUB_OUTPUT}"

          aws ec2-instance-connect send-ssh-public-key \
            --instance-id "${instance_id}" \
            --availability-zone "${availability_zone}" \
            --instance-os-user "${EC2_USER}" \
            --ssh-public-key "file://${ssh_key_path}.pub" \
            >/dev/null

          for attempt in {1..10}; do
            if ssh-keyscan -T 10 -H "${EC2_HOST}" >> ~/.ssh/known_hosts; then
              exit 0
            fi

            echo "ssh-keyscan failed for ${EC2_HOST} (attempt ${attempt}/10). Retrying..."
            sleep 5
          done

          echo "::error::Unable to scan SSH host key for ${EC2_HOST}."
          exit 1

      - name: Deploy dashboard to EC2
        shell: bash
        run: |
          ssh_key_path="${HOME}/.ssh/oceancampus-frontend-cd"
          ssh_public_key_path="${ssh_key_path}.pub"
          ssh_options="-i ${ssh_key_path} -o BatchMode=yes"

          refresh_ssh_public_key() {
            aws ec2-instance-connect send-ssh-public-key \
              --instance-id "${{ steps.prepare_ssh.outputs.instance_id }}" \
              --availability-zone "${{ steps.prepare_ssh.outputs.availability_zone }}" \
              --instance-os-user "${EC2_USER}" \
              --ssh-public-key "file://${ssh_public_key_path}" \
              >/dev/null
          }

          refresh_ssh_public_key
          ssh ${ssh_options} "${EC2_USER}@${EC2_HOST}" \
            "mkdir -p '${DASHBOARD_REMOTE_APP_DIR}/.next/static' '${DASHBOARD_REMOTE_APP_DIR}/public'"

          refresh_ssh_public_key
          rsync -az --delete -e "ssh ${ssh_options}" \
            apps/OC-DASHBOARD/.next/standalone/ \
            "${EC2_USER}@${EC2_HOST}:${DASHBOARD_REMOTE_ROOT}/"

          refresh_ssh_public_key
          rsync -az --delete -e "ssh ${ssh_options}" \
            apps/OC-DASHBOARD/.next/static/ \
            "${EC2_USER}@${EC2_HOST}:${DASHBOARD_REMOTE_APP_DIR}/.next/static/"

          if [ -d apps/OC-DASHBOARD/public ]; then
            refresh_ssh_public_key
            rsync -az --delete -e "ssh ${ssh_options}" \
              apps/OC-DASHBOARD/public/ \
              "${EC2_USER}@${EC2_HOST}:${DASHBOARD_REMOTE_APP_DIR}/public/"
          fi

          {
            echo "NODE_ENV=production"
            echo "PORT=3000"
            echo "HOSTNAME=127.0.0.1"
            echo "API_BASE_URL=${API_BASE_URL}"
            echo "S3_PUBLIC_BASE=${S3_PUBLIC_BASE}"
            echo "MAPBOX_TOKEN=${MAPBOX_TOKEN}"
          } > dashboard.env

          refresh_ssh_public_key
          scp ${ssh_options} dashboard.env \
            "${EC2_USER}@${EC2_HOST}:/tmp/oceancampus-dashboard.env"

          refresh_ssh_public_key
          ssh ${ssh_options} "${EC2_USER}@${EC2_HOST}" \
            "mv /tmp/oceancampus-dashboard.env '${DASHBOARD_REMOTE_ROOT}/.env' && chmod 600 '${DASHBOARD_REMOTE_ROOT}/.env' && sudo systemctl restart oceancampus-dashboard && sudo systemctl is-active oceancampus-dashboard"

      - name: Revoke runner SSH access
        if: always() && steps.ssh_access.outputs.runner_ip != ''
        shell: bash
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${EC2_SECURITY_GROUP_ID}" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.ssh_access.outputs.runner_ip }}/32" || true

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/admin*" "/record*" "/dashboard*"
