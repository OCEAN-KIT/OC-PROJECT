name: Build and Push ECR Images

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ecr-images.yml'
      - 'apps/OC-ADMIN/**'
      - 'apps/OC-DASHBOARD/**'
      - 'apps/OC-RECORD/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.base.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    name: Build and push ${{ matrix.repository }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - repository: oc-admin
            dockerfile: apps/OC-ADMIN/Dockerfile
          - repository: oc-dashboard
            dockerfile: apps/OC-DASHBOARD/Dockerfile
          - repository: oc-record
            dockerfile: apps/OC-RECORD/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate build args
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
        run: |
          if [ -z "$NEXT_PUBLIC_API_BASE_URL" ]; then
            echo "Missing NEXT_PUBLIC_API_BASE_URL secret."
            exit 1
          fi

          if [ "${{ matrix.repository }}" = "oc-dashboard" ] && [ -z "$NEXT_PUBLIC_MAPBOX_TOKEN" ]; then
            echo "Missing NEXT_PUBLIC_MAPBOX_TOKEN secret for oc-dashboard."
            exit 1
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repository }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repository }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_S3_PUBLIC_BASE=${{ secrets.NEXT_PUBLIC_S3_PUBLIC_BASE }}
            ${{ matrix.repository == 'oc-dashboard' && format('NEXT_PUBLIC_MAPBOX_TOKEN={0}', secrets.NEXT_PUBLIC_MAPBOX_TOKEN) || '' }}
          cache-from: type=gha,scope=${{ matrix.repository }}
          cache-to: type=gha,mode=max,scope=${{ matrix.repository }}

      - name: Deploy frontend app to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_USER" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "Missing EC2 deployment secrets."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%b\n' "$EC2_SSH_KEY" > ~/.ssh/oceankit-frontend-cd
          chmod 600 ~/.ssh/oceankit-frontend-cd

          ssh -i ~/.ssh/oceankit-frontend-cd \
            -o StrictHostKeyChecking=no \
            "$EC2_USER@$EC2_HOST" \
            "/opt/oceankit/scripts/deploy-frontend.sh ${{ matrix.repository }} ${{ github.sha }}"
